<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Nullius architecture: an unverified read path compared with a verified one</title>
  <desc id="dsc">Above, the read path used today: a wallet asks a provider for a balance and displays the reply, with no evidence anywhere in the path, so a truthful answer and a forged one are indistinguishable. Below, the Nullius path: the same wallet talks to nullius/provider, which asks several independent endpoints for a Merkle proof rather than a number. Every proof is walked locally in the browser against a state root anchored separately. Proofs that reach the root are marked proven; a forged proof from the adversarial endpoint fails at a named node and is rejected; if no endpoint is honest the result is nothing rather than a false value. The anchored state root is marked as the one remaining trust assumption.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#6b6f80"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#1f7a4d"/>
    </marker>
    <marker id="av" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#c02718"/>
    </marker>
    <style>
      text { font-family: 'Familjen Grotesk','Helvetica Neue',Arial,sans-serif; }
      .mono  { font-family: 'Spline Sans Mono','SFMono-Regular',Menlo,monospace; }
      .h1    { font-size: 25px; font-weight: 700; fill: #14161c; letter-spacing: -0.02em; }
      .sub   { font-size: 13.5px; fill: #5d6270; }
      .strap { font-size: 11px; fill: #8a8f9c; letter-spacing: 0.15em; }
      .box   { font-size: 14.5px; fill: #14161c; font-weight: 500; }
      .small { font-size: 11.5px; fill: #6b6f80; }
      .wire  { font-size: 11.5px; fill: #6b6f80; }
      .verdict { font-size: 13px; font-weight: 600; }
      .note  { font-size: 12.5px; fill: #5d6270; }
    </style>
  </defs>

  <rect width="1180" height="700" fill="#f4f5f7"/>

  <text class="h1" x="40" y="44">Where the trust goes</text>
  <text class="sub" x="40" y="66">Belief is created in exactly one place: your machine.</text>

  <!-- ================= TODAY ================= -->
  <rect x="40" y="96" width="1100" height="118" fill="#ffffff" stroke="#dfe1e7"/>
  <text class="strap" x="60" y="122">TODAY</text>

  <rect x="60" y="136" width="150" height="52" fill="#f4f5f7" stroke="#c9ccd4"/>
  <text class="box" x="75" y="160">Your wallet</text>
  <text class="small" x="75" y="177">viem · wagmi</text>

  <line x1="210" y1="162" x2="322" y2="162" stroke="#6b6f80" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <text class="mono wire" x="218" y="155">eth_getBalance</text>

  <rect x="326" y="136" width="150" height="52" fill="#f4f5f7" stroke="#c9ccd4"/>
  <text class="box" x="341" y="160">A company</text>
  <text class="small" x="341" y="177">Infura · Alchemy</text>

  <line x1="476" y1="162" x2="588" y2="162" stroke="#6b6f80" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <text class="mono wire" x="500" y="155">"4.2"</text>

  <rect x="592" y="136" width="150" height="52" fill="#f4f5f7" stroke="#c9ccd4"/>
  <text class="box" x="607" y="160">Your screen</text>
  <text class="mono small" x="607" y="177">4.2 ETH</text>

  <text class="note" x="782" y="152">No signature. No proof. No check.</text>
  <text class="note" x="782" y="171">A true answer and a forged one are</text>
  <text class="note" x="782" y="190">identical from here, so nothing catches one.</text>

  <!-- ================= NULLIUS ================= -->
  <rect x="40" y="238" width="1100" height="356" fill="#ffffff" stroke="#dfe1e7"/>
  <text class="strap" x="60" y="264">WITH NULLIUS</text>

  <rect x="60" y="286" width="132" height="52" fill="#f4f5f7" stroke="#c9ccd4"/>
  <text class="box" x="74" y="310">Your wallet</text>
  <text class="small" x="74" y="327">unchanged</text>

  <line x1="192" y1="312" x2="222" y2="312" stroke="#6b6f80" marker-end="url(#ar)"/>

  <rect x="226" y="280" width="158" height="64" fill="#2b1de8"/>
  <text class="box" x="242" y="306" fill="#ffffff">nullius/provider</text>
  <text class="mono small" x="242" y="325" fill="#c3bdff">EIP-1193 · drop-in</text>

  <text class="mono wire" x="398" y="272">asks for a proof, not a number</text>

  <!-- fan out -->
  <path d="M384 312 H414 V292 H452" fill="none" stroke="#6b6f80" marker-end="url(#ar)"/>
  <path d="M414 312 H452" fill="none" stroke="#6b6f80" marker-end="url(#ar)"/>
  <path d="M414 312 V386 H452" fill="none" stroke="#c02718" marker-end="url(#av)"/>

  <rect x="456" y="276" width="176" height="34" fill="#f4f5f7" stroke="#c9ccd4"/>
  <text class="box" x="470" y="298" font-size="13">endpoint A</text>

  <rect x="456" y="316" width="176" height="34" fill="#f4f5f7" stroke="#c9ccd4"/>
  <text class="box" x="470" y="338" font-size="13">endpoint B</text>

  <rect x="456" y="368" width="176" height="36" fill="#fdeeec" stroke="#c02718" stroke-width="1.5"/>
  <text class="box" x="470" y="384" font-size="13" fill="#c02718">evil-rpc</text>
  <text class="small" x="470" y="398" fill="#c02718">forges a proof on purpose</text>

  <text class="small" x="456" y="426">independent operators, asked in parallel</text>
  <text class="small" x="456" y="442">for speed, never for a vote</text>

  <!-- into the verifier -->
  <path d="M632 293 H664 V300" fill="none" stroke="#6b6f80" marker-end="url(#ar)"/>
  <path d="M632 333 H664 V326" fill="none" stroke="#6b6f80" marker-end="url(#ar)"/>
  <path d="M632 386 H664 V352" fill="none" stroke="#c02718" marker-end="url(#av)"/>

  <rect x="668" y="286" width="186" height="76" fill="#f7ffd9" stroke="#8ea300" stroke-width="1.5"/>
  <text class="box" x="683" y="309">Merkle walk</text>
  <text class="small" x="683" y="327">hash each node, check it</text>
  <text class="small" x="683" y="342">against its parent, in your</text>
  <text class="small" x="683" y="357">browser</text>

  <text class="small" x="668" y="382">where belief is created</text>

  <!-- anchor / trust boundary -->
  <rect x="642" y="470" width="238" height="94" fill="none" stroke="#c02718" stroke-dasharray="5 4"/>
  <text class="mono" x="654" y="490" font-size="10.5" fill="#c02718" letter-spacing="0.12em">TRUST BOUNDARY</text>
  <rect x="654" y="500" width="214" height="52" fill="#f4f5f7" stroke="#c9ccd4"/>
  <text class="box" x="668" y="521" font-size="13">Anchored state root</text>
  <text class="small" x="668" y="538">corroborated across endpoints</text>

  <path d="M838 470 V366" fill="none" stroke="#8ea300" stroke-dasharray="4 3" marker-end="url(#ag)" stroke-width="1.5"/>
  <text class="small" x="690" y="446" fill="#6b6f80">compared against</text>

  <text class="note" x="40" y="626">Everything above the dashed box is verified. The box itself is the one thing still trusted, and the app names it permanently on screen.</text>

  <!-- outcomes -->
  <line x1="854" y1="324" x2="886" y2="324" stroke="#6b6f80" marker-end="url(#ar)"/>

  <rect x="890" y="276" width="230" height="60" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.5"/>
  <rect x="906" y="292" width="11" height="11" fill="#1f7a4d"/>
  <text class="mono verdict" x="925" y="302" fill="#1f7a4d" letter-spacing="0.08em">PROVEN</text>
  <text class="small" x="906" y="322" fill="#14161c">First proof that verifies wins.</text>

  <rect x="890" y="346" width="230" height="60" fill="#ffffff" stroke="#c02718" stroke-width="1.5"/>
  <path d="M916 362 h-10 v11 h5 M913 364 l5 9 M918 364 l-5 9" stroke="#c02718" stroke-width="1.3" fill="none"/>
  <text class="mono verdict" x="925" y="372" fill="#c02718" letter-spacing="0.08em">REJECTED</text>
  <text class="small" x="906" y="392" fill="#14161c">Broke at node 4 of 5. Named.</text>

  <rect x="890" y="416" width="230" height="60" fill="#ffffff" stroke="#c9ccd4"/>
  <text class="mono verdict" x="906" y="440" fill="#6b6f80" letter-spacing="0.08em">NOTHING</text>
  <text class="small" x="906" y="460" fill="#14161c">Zero honest endpoints. Fails closed.</text>

  <text class="small" x="890" y="500" fill="#6b6f80">One honest endpoint out of any</text>
  <text class="small" x="890" y="516" fill="#6b6f80">number is enough, because this is</text>
  <text class="small" x="890" y="532" fill="#6b6f80">arithmetic and not a vote.</text>

  <!-- ================= MODULES ================= -->
  <text class="strap" x="40" y="664">SAME PRINCIPLE, FOUR PLACES</text>
  <text class="mono box" x="40" y="688" font-size="13" fill="#2b1de8">provider</text>
  <text class="small" x="128" y="688">reads you can check</text>
  <text class="mono box" x="330" y="688" font-size="13" fill="#2b1de8">route</text>
  <text class="small" x="392" y="688">who actually includes your transaction</text>
  <text class="mono box" x="700" y="688" font-size="13" fill="#2b1de8">id</text>
  <text class="small" x="732" y="688">stake instead of identity</text>
  <text class="mono box" x="920" y="688" font-size="13" fill="#2b1de8">quorum</text>
  <text class="small" x="1000" y="688">agree with no platform</text>
</svg>
